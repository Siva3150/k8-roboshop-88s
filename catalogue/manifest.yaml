apiVersion: apps/v1 
kind: Deployment 
metadata: 
 name: catalogue
 namespace: roboshop  
 # these are replicaset labels
 labels: 
  project: roboshop 
  component: catalogue 
  tier: backend 
spec: 
 replicas: 1
 selector:
 # these labels are used to select pods  
  matchLabels: 
   project: roboshop 
   component: catalogue 
   tier: backend
  # pod defintion 
 template: 
  metadata: 
   labels: 
    project: roboshop 
    component: catalogue 
    tier: backend
  spec: 
   containers: 
   - name: catalogue 
     image: siva3150/catalogue:v1 
     imagePullPolicy: Always 
     readinessProbe: 
      tcpSocket: 
       port: 8080 
     livenessProbe: 
      tcpSocket: 
       port: 8080 

--- 
apiVersion: v1 
kind: Service  
metadata: 
 name: catalogue
 namespace: roboshop 
spec: 
 selector: 
  project: roboshop 
  component: catalogue 
  tier: backend
 ports: 
 - protocol: TCP 
   port: 8080 #service port
   targetPort: 8080 #container port

   
    
